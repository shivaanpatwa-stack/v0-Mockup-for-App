<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Standby">
  <rect width="512" height="512" rx="112" fill="#111413"/>
  <!-- Star of Life -->
  <g fill="#3DBB85">
    <rect x="200" y="84" width="112" height="344" rx="16"/>
    <rect x="200" y="84" width="112" height="344" rx="16" transform="rotate(60 256 256)"/>
    <rect x="200" y="84" width="112" height="344" rx="16" transform="rotate(120 256 256)"/>
  </g>
  <!-- Route S: white staging dot to white first-aid plus -->
  <path d="M296 206.6 A40 40 0 1 0 256 256 A40 40 0 1 1 216 305.4" fill="none" stroke="#111413" stroke-width="28" stroke-linecap="round"/>
  <!-- Matching end markers: same charcoal disc, white dot (start) and white plus (end) -->
  <circle cx="296" cy="206.6" r="24" fill="#111413"/>
  <circle cx="296" cy="206.6" r="9.5" fill="#FFFFFF"/>
  <circle cx="216" cy="305.4" r="24" fill="#111413"/>
